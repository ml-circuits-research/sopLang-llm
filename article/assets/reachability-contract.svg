<svg xmlns="http://www.w3.org/2000/svg" width="600" height="565" viewBox="0 0 600 565" role="img"><title>Undirected and directed reachability require different command semantics</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="25" y="42" font-size="30" fill="#162c3a" font-weight="700" text-anchor="start">Question: can A reach C?</text><text x="25" y="101" font-size="25" fill="#225e88" font-weight="700" text-anchor="start">SUPPORTED: undirected links</text><path d="M130 167 L270 167" fill="none" stroke="#225e88" stroke-width="3"/><path d="M330 167 L470 167" fill="none" stroke="#225e88" stroke-width="3"/><circle cx="100" cy="167" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="100" y="177" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">A</text><circle cx="300" cy="167" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="300" y="177" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">B</text><circle cx="500" cy="167" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="500" y="177" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">C</text><text x="300" y="241" font-size="28" fill="#225e88" font-weight="700" text-anchor="middle">A can reach C: yes</text><path d="M25 276 L575 276" fill="none" stroke="#b8c5cd" stroke-width="2"/><text x="25" y="318" font-size="25" fill="#a64b25" font-weight="700" text-anchor="start">EXCLUDED: direction matters</text><path d="M268 382 L134 382" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="134,382 149,389 149,375" fill="#162c3a"/><path d="M468 382 L334 382" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="334,382 349,389 349,375" fill="#162c3a"/><circle cx="100" cy="382" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="100" y="392" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">A</text><circle cx="300" cy="382" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="300" y="392" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">B</text><circle cx="500" cy="382" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="500" y="392" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">C</text><text x="300" y="456" font-size="28" fill="#a64b25" font-weight="700" text-anchor="middle">A can reach C: no</text><text x="25" y="510" font-size="24" fill="#162c3a" font-weight="400" text-anchor="start">graphPath represents undirected links.</text><text x="25" y="545" font-size="24" fill="#162c3a" font-weight="400" text-anchor="start">Dropping direction changes the task.</text></g></svg>