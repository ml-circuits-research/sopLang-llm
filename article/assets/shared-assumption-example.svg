<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img"><title>A constructed directed-graph example shows how common parsing assumptions defeat evidential independence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="43" font-size="30" fill="#162c3a" font-weight="700" text-anchor="start">Constructed counterexample: agreement with a shared mistake</text><text x="30" y="91" font-size="26" fill="#225e88" font-weight="700" text-anchor="start">STATED TASK: directed links; can A reach C?</text><path d="M293 165 L159 165" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="159,165 174,172 174,158" fill="#162c3a"/><path d="M493 165 L359 165" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="359,165 374,172 374,158" fill="#162c3a"/><circle cx="125" cy="165" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="125" y="175" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">A</text><circle cx="325" cy="165" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="325" y="175" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">B</text><circle cx="525" cy="165" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="525" y="175" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">C</text><text x="790" y="157" font-size="32" fill="#225e88" font-weight="700" text-anchor="start">Correct answer: no</text><text x="790" y="204" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">The arrows point toward A.</text><path d="M325 205 L325 306" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="325,306 332,291 318,291" fill="#162c3a"/><text x="350" y="267" font-size="26" fill="#a64b25" font-weight="700" text-anchor="start">A shared parse drops direction</text><rect x="30" y="320" width="550" height="233" fill="#fcf0e8" stroke="#a64b25" stroke-width="2" rx="6"/><text x="52" y="365" font-size="24" fill="#a64b25" font-weight="700" text-anchor="start">THE PARSED TASK IS NOW DIFFERENT</text><path d="M155 429 L275 429" fill="none" stroke="#225e88" stroke-width="3"/><path d="M335 429 L465 429" fill="none" stroke="#225e88" stroke-width="3"/><circle cx="125" cy="429" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="125" y="439" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">A</text><circle cx="305" cy="429" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="305" y="439" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">B</text><circle cx="495" cy="429" r="28" fill="white" stroke="#225e88" stroke-width="3"/><text x="495" y="439" font-size="30" fill="#225e88" font-weight="700" text-anchor="middle">C</text><text x="52" y="515" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Undirected links permit A to reach C.</text><path d="M585 433 H640 V369 H700" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="700,369 685,362 685,376" fill="#162c3a"/><path d="M640 433 V505 H700" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="700,505 685,498 685,512" fill="#162c3a"/><rect x="715" y="323" width="455" height="94" fill="#f6f8fa" stroke="#b8c5cd" stroke-width="2" rx="6"/><text x="738" y="359" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">Generated solver</text><text x="738" y="396" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">returns yes</text><rect x="715" y="459" width="455" height="94" fill="#f6f8fa" stroke="#b8c5cd" stroke-width="2" rx="6"/><text x="738" y="495" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">Reference computation</text><text x="738" y="532" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">returns yes</text><text x="600" y="625" font-size="31" fill="#162c3a" font-weight="700" text-anchor="middle">Both computations agree.</text><text x="600" y="674" font-size="29" fill="#a64b25" font-weight="400" text-anchor="middle">Both answer a different graph problem.</text></g></svg>