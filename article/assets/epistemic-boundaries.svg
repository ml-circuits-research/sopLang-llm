<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#222"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#111"><rect x="20" y="35" width="330" height="110" rx="7" fill="#f1f1f1" stroke="#222" stroke-width="2"/><text x="185" y="83.7" font-size="21" font-weight="bold" text-anchor="middle">Construction</text><text x="185" y="109.74000000000001" font-size="21" font-weight="normal" text-anchor="middle">agent writes task and solution</text><path d="M355,90 L380,90" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="390" y="35" width="320" height="110" rx="7" fill="#f1f1f1" stroke="#222" stroke-width="2"/><text x="550" y="83.7" font-size="21" font-weight="bold" text-anchor="middle">Verification</text><text x="550" y="109.74000000000001" font-size="21" font-weight="normal" text-anchor="middle">oracle, runtime, perturbations</text><path d="M715,90 L740,90" fill="none" stroke="#222" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="750" y="35" width="330" height="110" rx="7" fill="#f1f1f1" stroke="#222" stroke-width="2"/><text x="915" y="83.7" font-size="21" font-weight="bold" text-anchor="middle">Interpretation</text><text x="915" y="109.74000000000001" font-size="21" font-weight="normal" text-anchor="middle">researcher makes a claim</text><rect x="20" y="220" width="330" height="145" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="185" y="271.34000000000003" font-size="23" font-weight="bold" text-anchor="middle">Remaining uncertainty</text><text x="185" y="299.86" font-size="23" font-weight="normal" text-anchor="middle">shared assumptions</text><text x="185" y="328.38000000000005" font-size="23" font-weight="normal" text-anchor="middle">in the generator</text><rect x="390" y="220" width="320" height="145" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="550" y="271.34000000000003" font-size="23" font-weight="bold" text-anchor="middle">Remaining uncertainty</text><text x="550" y="299.86" font-size="23" font-weight="normal" text-anchor="middle">wrong task or</text><text x="550" y="328.38000000000005" font-size="23" font-weight="normal" text-anchor="middle">incomplete scoring rule</text><rect x="750" y="220" width="330" height="145" rx="7" fill="#fff" stroke="#222" stroke-width="2"/><text x="915" y="271.34000000000003" font-size="23" font-weight="bold" text-anchor="middle">Remaining uncertainty</text><text x="915" y="299.86" font-size="23" font-weight="normal" text-anchor="middle">overgeneralization</text><text x="915" y="328.38000000000005" font-size="23" font-weight="normal" text-anchor="middle">and missing comparisons</text><path d="M185,150 L185,210" fill="none" stroke="#222" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M550,150 L550,210" fill="none" stroke="#222" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/><path d="M915,150 L915,210" fill="none" stroke="#222" stroke-width="2.4" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="550" y="440" font-size="25" font-weight="bold" text-anchor="middle">Agreement inside a pipeline does not establish independence.</text><text x="550" y="483" font-size="23" font-weight="normal" text-anchor="middle">Keep evidence that can challenge each stage.</text></g></svg>