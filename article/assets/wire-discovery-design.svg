<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="625" viewBox="0 0 1200 625" role="img"><title>A future paired experimental design separates command development from sealed transfer evaluation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="43" font-size="32" fill="#162c3a" font-weight="700" text-anchor="start">Proposed test of one new executable abstraction</text><rect x="30" y="74" width="1140" height="65" fill="#f2f6f8" stroke="none" stroke-width="2" rx="6"/><text x="52" y="115" font-size="27" fill="#162c3a" font-weight="400" text-anchor="start">Shared base revision, training-token budget, checkpoint rule, and decoding</text><path d="M385 142 L385 174" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="385,174 392,159 378,159" fill="#162c3a"/><path d="M850 142 L850 174" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="850,174 857,159 843,159" fill="#162c3a"/><rect x="170" y="185" width="430" height="147" fill="#e8f1f7" stroke="#225e88" stroke-width="2" rx="6"/><text x="190" y="222" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">Target A: generate the algorithm</text><text x="190" y="262" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">JavaScript scheduling code</text><text x="190" y="302" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">Durations + predecessor relations</text><rect x="635" y="185" width="430" height="147" fill="#e8f4ef" stroke="#16776b" stroke-width="2" rx="6"/><text x="655" y="222" font-size="25" fill="#16776b" font-weight="400" text-anchor="start">Target B: select the operation</text><text x="655" y="262" font-size="25" fill="#16776b" font-weight="400" text-anchor="start">A dependency-join command</text><text x="655" y="302" font-size="25" fill="#16776b" font-weight="400" text-anchor="start">The same durations and relations</text><path d="M385 338 V385 H850 V424" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="850,424 857,409 843,409" fill="#162c3a"/><path d="M850 338 L850 380" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="850,380 857,365 843,365" fill="#162c3a"/><text x="45" y="380" font-size="25" fill="#63717b" font-weight="400" text-anchor="start">Train several seeds</text><rect x="30" y="445" width="350" height="112" fill="white" stroke="#162c3a" stroke-width="2" rx="6"/><text x="50" y="474" font-size="24" fill="#162c3a" font-weight="700" text-anchor="start">Sealed transfer families</text><text x="50" y="507" font-size="24" fill="#162c3a" font-weight="700" text-anchor="start">Not used for</text><text x="50" y="540" font-size="24" fill="#162c3a" font-weight="700" text-anchor="start">command design</text><path d="M387 500 L437 500" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="437,500 422,493 422,507" fill="#162c3a"/><rect x="445" y="440" width="725" height="128" fill="#f2f6f8" stroke="none" stroke-width="2" rx="6"/><text x="465" y="475" font-size="24" fill="#162c3a" font-weight="400" text-anchor="start">Compare task correctness and error types</text><text x="465" y="510" font-size="24" fill="#162c3a" font-weight="400" text-anchor="start">Wrong operation · wrong arguments · execution failure</text><text x="465" y="545" font-size="24" fill="#162c3a" font-weight="400" text-anchor="start">Also measure generated length and computational cost</text><text x="30" y="608" font-size="25" fill="#63717b" font-weight="400" text-anchor="start">Candidate design uses development failures; transfer results test the frozen choice.</text></g></svg>