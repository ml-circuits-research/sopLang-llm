<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img"><title>SOP Lang declaration, body, value reference, and dependency for a complete arithmetic example</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="42" font-size="32" fill="#162c3a" font-weight="700" text-anchor="start">A complete compiled solution</text><rect x="30" y="68" width="1140" height="60" fill="#f2f6f8" stroke="none" stroke-width="2" rx="6"/><text x="50" y="107" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start">Problem: three packs, four cells per pack. How many cells?</text><text x="48" y="173" font-size="22" fill="#63717b" font-weight="700" text-anchor="start">GENERATED PROGRAM</text><rect x="30" y="191" width="745" height="239" fill="#f6f8fa" stroke="none" stroke-width="2" rx="6"/><text x="50" y="235" font-size="28" fill="#225e88" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono,monospace">@slots literal</text><text x="50" y="277" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">{"packs":3,"perPack":4}</text><text x="50" y="349" font-size="28" fill="#225e88" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono,monospace">@answer jsEval</text><text x="50" y="391" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">return $slots.packs * $slots.perPack;</text><text x="835" y="173" font-size="22" fill="#63717b" font-weight="700" text-anchor="start">VALUE DEPENDENCY</text><rect x="830" y="193" width="340" height="82" fill="#e8f1f7" stroke="#225e88" stroke-width="2" rx="6"/><text x="1000" y="226" font-size="28" fill="#225e88" font-weight="700" text-anchor="middle">slots</text><text x="1000" y="257" font-size="24" fill="#162c3a" font-weight="400" text-anchor="middle">packs = 3; perPack = 4</text><path d="M1000 281 L1000 336" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="1000,336 1007,321 993,321" fill="#162c3a"/><text x="1020" y="316" font-size="24" fill="#225e88" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">$slots</text><rect x="830" y="345" width="340" height="85" fill="#e8f4ef" stroke="#16776b" stroke-width="2" rx="6"/><text x="1000" y="379" font-size="28" fill="#16776b" font-weight="700" text-anchor="middle">answer</text><text x="1000" y="413" font-size="28" fill="#162c3a" font-weight="400" text-anchor="middle">3 × 4 = 12</text><text x="32" y="477" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">@name command starts a wire; its body follows on the next line.</text><text x="32" y="517" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start">$name reads a value. The reference determines execution order.</text></g></svg>