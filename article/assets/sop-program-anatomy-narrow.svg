<svg xmlns="http://www.w3.org/2000/svg" width="600" height="710" viewBox="0 0 600 710" role="img"><title>Column-width guide to declarations, bodies, value references, and execution order</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="25" y="37" font-size="28" fill="#162c3a" font-weight="700" text-anchor="start">Three packs × four cells</text><text x="25" y="74" font-size="28" fill="#162c3a" font-weight="700" text-anchor="start">What program returns the total?</text><rect x="20" y="104" width="560" height="285" fill="#f6f8fa" stroke="none" stroke-width="2" rx="6"/><text x="40" y="147" font-size="26" fill="#225e88" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono,monospace">@slots literal</text><text x="40" y="187" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">{"packs":3,"perPack":4}</text><text x="40" y="252" font-size="26" fill="#225e88" font-weight="700" text-anchor="start" font-family="DejaVu Sans Mono,monospace">@answer jsEval</text><text x="40" y="292" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">return $slots.packs</text><text x="40" y="332" font-size="26" fill="#162c3a" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">  * $slots.perPack;</text><text x="25" y="430" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">@name command: declaration</text><text x="25" y="468" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Body: JSON or JavaScript here</text><text x="25" y="506" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">$slots: read the named value</text><rect x="25" y="550" width="225" height="96" fill="#e8f1f7" stroke="#225e88" stroke-width="2" rx="6"/><rect x="350" y="550" width="225" height="96" fill="#e8f4ef" stroke="#16776b" stroke-width="2" rx="6"/><text x="138" y="585" font-size="28" fill="#225e88" font-weight="700" text-anchor="middle">slots</text><text x="138" y="625" font-size="26" fill="#162c3a" font-weight="400" text-anchor="middle">3 and 4</text><path d="M260 598 L340 598" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="340,598 325,591 325,605" fill="#162c3a"/><text x="462" y="585" font-size="28" fill="#16776b" font-weight="700" text-anchor="middle">answer</text><text x="462" y="625" font-size="28" fill="#162c3a" font-weight="400" text-anchor="middle">12</text><text x="25" y="690" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Runtime order follows the reference.</text></g></svg>