<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Specific model-identity, population, and judgment checks bound the scientific interpretation</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="45" font-size="32" fill="#162c3a" font-weight="700" text-anchor="start">The artifact needed depends on the claim</text><text x="30" y="106" font-size="27" fill="#63717b" font-weight="700" text-anchor="start">Record inspected</text><text x="430" y="106" font-size="27" fill="#63717b" font-weight="700" text-anchor="start">Audit finding</text><text x="830" y="106" font-size="27" fill="#63717b" font-weight="700" text-anchor="start">Supported interpretation</text><path d="M30 129 L1170 129" fill="none" stroke="#b8c5cd" stroke-width="2"/><text x="30" y="182" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">1  Model manifest</text><text x="30" y="221" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Resolve the released model</text><text x="30" y="260" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">behind a misleading label</text><text x="430" y="182" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">Qwen3-1.7B</text><text x="430" y="221" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">The apparent tenfold size</text><text x="430" y="260" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">contrast is absent</text><text x="830" y="182" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Compare actual systems.</text><text x="830" y="221" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Keep the observed outputs;</text><text x="830" y="260" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">correct the size claim.</text><path d="M30 302 L1170 302" fill="none" stroke="#b8c5cd" stroke-width="2"/><text x="30" y="349" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">2  Evaluation identifiers</text><text x="30" y="388" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Both versions contain</text><text x="30" y="427" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">705 evaluated problems</text><text x="430" y="349" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">92.9% shared identifiers</text><text x="430" y="388" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">7.1% replaced</text><text x="430" y="427" font-size="25" fill="#225e88" font-weight="400" text-anchor="start">Some shared answers change</text><text x="830" y="349" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Equal sample size does</text><text x="830" y="388" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">not establish the same test.</text><text x="830" y="427" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Join items before comparing.</text><path d="M30 469 L1170 469" fill="none" stroke="#b8c5cd" stroke-width="2"/><text x="30" y="516" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">3  Judgment records</text><text x="30" y="555" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">833 judge inputs retained</text><text x="30" y="594" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Individual verdicts absent</text><text x="430" y="516" font-size="25" fill="#a64b25" font-weight="400" text-anchor="start">Input ≠ decision</text><text x="430" y="555" font-size="25" fill="#a64b25" font-weight="400" text-anchor="start">The semantic aggregate</text><text x="430" y="594" font-size="25" fill="#a64b25" font-weight="400" text-anchor="start">cannot be reconstructed</text><text x="830" y="516" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Withhold that aggregate.</text><text x="830" y="555" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Retain the documented</text><text x="830" y="594" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">evidence gap.</text></g></svg>