<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img"><title>Declared duration-and-feasibility equivalence and the complete restricted diagnostic partition</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#162c3a"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="30" y="43" font-size="29" fill="#162c3a" font-weight="700" text-anchor="start">One retained scheduling example</text><text x="690" y="43" font-size="29" fill="#162c3a" font-weight="700" text-anchor="start">All scheduling cases</text><rect x="30" y="78" width="590" height="124" fill="#f2f6f8" stroke="none" stroke-width="2" rx="6"/><text x="52" y="116" font-size="23" fill="#63717b" font-weight="700" text-anchor="start">REFERENCE ANSWER EXCERPT</text><text x="52" y="154" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start">46 minutes</text><text x="52" y="188" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start">“is not feasible”</text><rect x="30" y="227" width="590" height="124" fill="#e8f1f7" stroke="none" stroke-width="2" rx="6"/><text x="52" y="265" font-size="23" fill="#225e88" font-weight="700" text-anchor="start">MODEL ANSWER EXCERPT</text><text x="52" y="303" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start">46 minutes</text><text x="52" y="337" font-size="28" fill="#162c3a" font-weight="400" text-anchor="start">“does not meet the limit”</text><path d="M325 359 L325 415" fill="none" stroke="#162c3a" stroke-width="2.6"/><polygon points="325,415 332,400 318,400" fill="#162c3a"/><rect x="30" y="429" width="590" height="79" fill="#e8f4ef" stroke="#16776b" stroke-width="2" rx="6"/><text x="52" y="477" font-size="26" fill="#16776b" font-weight="700" text-anchor="start">(minutes = 46, feasible = false)</text><text x="690" y="89" font-size="24" fill="#63717b" font-weight="400" text-anchor="start">100 problems · declared grammar</text><text x="690" y="137" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Restricted match</text><rect x="690" y="151" width="268.8" height="30" fill="#16776b" stroke="none" stroke-width="2" rx="0"/><text x="973.8" y="176" font-size="26" fill="#16776b" font-weight="700" text-anchor="start">64%</text><text x="690" y="228" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Unclassified</text><rect x="690" y="242" width="109.2" height="30" fill="#63717b" stroke="none" stroke-width="2" rx="0"/><text x="814.2" y="267" font-size="26" fill="#63717b" font-weight="700" text-anchor="start">26%</text><text x="690" y="319" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Disagreement</text><rect x="690" y="333" width="8.4" height="30" fill="#a64b25" stroke="none" stroke-width="2" rx="0"/><text x="713.4" y="358" font-size="26" fill="#a64b25" font-weight="700" text-anchor="start">2%</text><text x="690" y="410" font-size="25" fill="#162c3a" font-weight="400" text-anchor="start">Execution failure</text><rect x="690" y="424" width="33.6" height="30" fill="#162c3a" stroke="none" stroke-width="2" rx="0"/><text x="738.6" y="449" font-size="26" fill="#162c3a" font-weight="700" text-anchor="start">8%</text><text x="30" y="564" font-size="25" fill="#63717b" font-weight="400" text-anchor="start">Only complete supported answers are classified; unsupported prose remains unclassified.</text></g></svg>